<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Shop Display — SAI WORKSHOP OS</title>
<style>
:root{--bg:#05070c;--pnl:#0b111c;--pnl2:#101a2a;--line:#1b2840;--txt:#e9eef7;--dim:#7d8aa3;--amb:#ffb020;--grn:#22d47a;--red:#ff4d5e;--cyn:#2ec5ff;--pur:#b17cff;--org:#ff8a3d;
  --flap:#121a28;--mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(180deg,#0c1424,#070b13);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:3px;color:var(--amb);font-size:clamp(14px,1.6vw,22px);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--grn);letter-spacing:2px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:pulse 1.6s infinite}
.live.off{color:var(--red)}.live.off i{background:var(--red);box-shadow:0 0 10px var(--red)}
@keyframes pulse{50%{opacity:.25}}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button,.ctl{background:var(--pnl2);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
nav button.on{color:#05070c;background:var(--amb);border-color:var(--amb);font-weight:700}
.clock{font-family:var(--mono);font-size:clamp(18px,2.4vw,34px);color:var(--txt);letter-spacing:2px;text-align:right;line-height:1}
.clock small{display:block;font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:3px}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;padding:14px 18px;display:none;flex-direction:column;gap:12px;overflow:hidden}
.scr.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{flex:1 1 130px;background:var(--pnl);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.st b{display:block;font-family:var(--mono);font-size:clamp(24px,3.2vw,46px);line-height:1}
.st span{font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
/* ✈ departures */
.board{flex:1;display:flex;flex-direction:column;background:var(--pnl);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.brow{display:grid;grid-template-columns:8.5em 1.6fr 1.4fr 1.1fr 1fr 11em 6.5em 10.5em;gap:8px;align-items:center;padding:0 14px;border-bottom:1px solid #0e1626;min-height:clamp(40px,5.6vh,64px)}
.bhead{background:#0d1626;color:var(--amb);font-size:12px;letter-spacing:2px;text-transform:uppercase;min-height:38px}
.cell{font-family:var(--mono);font-size:clamp(13px,1.45vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{display:inline-block;background:var(--flap);color:#f4f6fb;border-radius:3px;padding:0 2px;margin-right:1px;box-shadow:inset 0 -1px 0 #000,inset 0 1px 0 #1f2b40}
.flip .fl{animation:flip .55s ease-out both}
@keyframes flip{0%{transform:rotateX(90deg);filter:brightness(2)}60%{transform:rotateX(-14deg)}100%{transform:none}}
.pill{display:inline-block;padding:4px 10px;border-radius:7px;font-family:var(--mono);font-weight:700;font-size:clamp(11px,1.15vw,17px);letter-spacing:1px}
.sNEW{background:rgba(255,176,32,.14);color:var(--amb)}.sASSIGNED{background:rgba(46,197,255,.12);color:var(--cyn)}
.sREPAIR{background:rgba(46,197,255,.2);color:var(--cyn)}.sPARTS{background:rgba(177,124,255,.18);color:var(--pur)}
.sDONE{background:rgba(255,138,61,.16);color:var(--org)}.sREADY{background:rgba(34,212,122,.18);color:var(--grn);animation:glow 1.8s infinite}
.sDELIVERED{background:#162033;color:var(--dim)}
@keyframes glow{50%{box-shadow:0 0 18px rgba(34,212,122,.55)}}
.late{color:var(--red)!important}.urg{color:var(--red);font-weight:800}
.pager{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;padding:6px 14px;letter-spacing:1px}
/* 🔔 collection */
.coll{flex:1;display:grid;grid-template-columns:1fr 1.25fr;gap:14px;min-height:0}
.cbox{background:var(--pnl);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:0}
.cbox h2{margin:0 0 10px;font-size:clamp(16px,2vw,30px);letter-spacing:3px}
.tix{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:hidden}
.tk{background:var(--pnl2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:9em}
.tk b{display:block;font-family:var(--mono);font-size:clamp(22px,3vw,48px);letter-spacing:2px}
.tk span{font-size:clamp(11px,1.1vw,16px);color:var(--dim)}
.tk.rd{border-color:var(--grn);background:linear-gradient(160deg,rgba(34,212,122,.18),rgba(34,212,122,.04))}
.tk.rd b{color:var(--grn)}.tk.nw{animation:pop 1.2s ease-out 3}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.12);box-shadow:0 0 40px rgba(34,212,122,.8)}100%{transform:scale(1)}}
/* 🧑‍🔧 workbench */
.bench{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-content:start;overflow:hidden}
.tech{background:var(--pnl);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.tech .nm{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,1.6vw,22px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#05070c;font-size:18px;flex:none}
.tech .state{margin-left:auto;font-size:12px;letter-spacing:2px}
.job{margin-top:10px;background:var(--pnl2);border-radius:12px;padding:10px 12px}
.job .ph{font-size:clamp(16px,1.8vw,26px);font-weight:700}
.job .pb{color:var(--dim);font-size:clamp(12px,1.2vw,17px);margin:2px 0 6px}
.timer{font-family:var(--mono);font-size:clamp(26px,3.4vw,52px);color:var(--cyn);letter-spacing:2px}
.timer.paused{color:var(--amb)}
.q{margin-top:8px;font-size:12px;color:var(--dim)}
.q i{font-style:normal;display:inline-block;background:#0e1828;border:1px solid var(--line);border-radius:7px;padding:2px 7px;margin:2px 3px 0 0;font-family:var(--mono);color:var(--txt)}
.steps{display:flex;gap:4px;margin-top:8px}.steps s{flex:1;height:6px;border-radius:3px;background:#1a2538;text-decoration:none}.steps s.d{background:var(--cyn)}.steps s.n{background:var(--amb);animation:pulse 1.4s infinite}
.free{color:var(--grn);font-size:clamp(14px,1.5vw,20px);margin-top:14px;letter-spacing:2px}
/* 📅 today */
.tl{flex:1;background:var(--pnl);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;min-height:0}
.axis{position:relative;height:22px;margin-left:12em;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
.axis span{position:absolute;transform:translateX(-50%)}
.rows{flex:1;overflow:hidden;position:relative}
.tr{display:flex;align-items:center;height:clamp(20px,3.2vh,34px)}
.tr .lb{width:12em;flex:none;font-family:var(--mono);font-size:clamp(11px,1vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.tr .tk2{position:relative;flex:1;height:60%}
.bar{position:absolute;top:0;bottom:0;border-radius:6px;min-width:4px}
.bar.go{background:linear-gradient(90deg,rgba(46,197,255,.35),var(--cyn));}
.bar.dn{background:linear-gradient(90deg,rgba(34,212,122,.35),var(--grn))}
.bar.wt{background:repeating-linear-gradient(45deg,rgba(255,176,32,.5) 0 6px,rgba(255,176,32,.2) 6px 12px)}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);box-shadow:0 0 10px var(--red)}
/* ticker */
footer{border-top:1px solid var(--line);background:#070b13;height:44px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
footer .tag{background:var(--amb);color:#05070c;font-weight:800;letter-spacing:2px;padding:0 14px;height:100%;display:flex;align-items:center;font-size:13px}
#tick{display:inline-block;padding-left:100%;animation:tick 60s linear infinite;font-family:var(--mono);font-size:15px;color:var(--txt)}
#tick em{font-style:normal;color:var(--amb);margin:0 6px 0 28px}
@keyframes tick{to{transform:translateX(-100%)}}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--dim)}
.msg b{display:block;color:var(--txt);font-size:22px;margin-bottom:10px}
.foot2{font-size:11px;color:#3d4a62;font-family:var(--mono)}
@media (max-width:820px){header{flex-wrap:wrap;padding:8px 12px;gap:8px}nav{order:3;width:100%;margin-left:0}.clock{margin-left:auto;font-size:18px}.st{flex:1 1 30%;padding:7px 9px}.st b{font-size:22px}.st span{font-size:10px}.scr{padding:10px}.brow{grid-template-columns:6.2em 1fr 8.2em;gap:6px;padding:0 8px}.brow .c3,.brow .c4,.brow .c5,.brow .c7,.brow .c8{display:none}.cell{font-size:13px}.fl{padding:0 1px}.coll{grid-template-columns:1fr}nav button{padding:6px 9px;font-size:12px}.axis{margin-left:7em}.tr .lb{width:7em}}
</style>
</head>
<body>
<header>
  <div><div class="logo" id="shop">SAI WORKSHOP</div><div class="live" id="live"><i></i><span id="liveTx">CONNECTING</span></div></div>
  <nav id="nav">
    <button data-s="dep">✈ <span data-t="dep"></span></button>
    <button data-s="col">🔔 <span data-t="col"></span></button>
    <button data-s="tec">🧑‍🔧 <span data-t="tec"></span></button>
    <button data-s="day">📅 <span data-t="day"></span></button>
    <button class="ctl" id="auto">⟳ <span data-t="auto"></span></button>
    <button class="ctl" id="snd">🔇</button>
    <button class="ctl" id="lang">EN/हि</button>
    <button class="ctl" id="fs">⛶</button>
  </nav>
  <div class="clock" id="clock">--:--<small id="date"></small></div>
</header>
<main>
  <section class="scr" id="s-dep">
    <div class="stats" id="depStats"></div>
    <div class="board"><div class="brow bhead" id="depHead"></div><div id="depRows" style="flex:1;overflow:hidden"></div><div class="pager" id="depPager"></div></div>
  </section>
  <section class="scr" id="s-col"><div class="coll">
    <div class="cbox"><h2 style="color:var(--cyn)" id="colWorkH"></h2><div class="tix" id="colWork"></div></div>
    <div class="cbox" style="border-color:rgba(34,212,122,.45)"><h2 style="color:var(--grn)" id="colReadyH"></h2><div class="tix" id="colReady"></div></div>
  </div></section>
  <section class="scr" id="s-tec"><div class="stats" id="tecStats"></div><div class="bench" id="bench"></div></section>
  <section class="scr" id="s-day"><div class="stats" id="dayStats"></div><div class="tl"><div style="font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:1px" id="legend"></div><div class="axis" id="axis"></div><div class="rows" id="tlRows"></div></div></section>
  <div class="msg" id="msg" style="display:none"></div>
</main>
<footer><div class="tag" id="tickTag">LIVE</div><div style="flex:1;overflow:hidden"><span id="tick"></span></div><div class="foot2" id="foot2" style="padding:0 10px"></div></footer>
<script>
/* SAI WORKSHOP OS — SHOP DISPLAY. Read-only. Shows phone, problem, first name, technician and times — never money or mobile numbers. */
var FBV='10.12.2',L=localStorage,LANG=(function(){try{return L.getItem('SSM_DSP_LANG')||'en';}catch(e){return 'en';}})();
var TX={en:{dep:'DEPARTURES',col:'COLLECTION',tec:'WORKBENCH',day:'TODAY',auto:'AUTO',
  hd:['TICKET','PHONE','PROBLEM','CUSTOMER','TECHNICIAN','STATUS','IN SHOP','PROMISED'],
  st:{NEW:'WAITING',ASSIGNED:'TAKEN',REPAIR:'REPAIRING',PARTS:'PART AWAITED',DONE:'QUALITY CHECK',READY:'READY ✓',DELIVERED:'DELIVERED'},
  inShop:'phones in shop',waiting:'waiting',repairing:'repairing',parts:'awaiting parts',ready:'ready to collect',done:'delivered today',late:'late',
  working:'NOW REPAIRING',readyH:'READY — PLEASE COLLECT',free:'FREE — ready for next job',paused:'PAUSED',busy:'WORKING',queue:'next',
  today:'came in today',fin:'finished today',avg:'avg repair',fast:'fastest',page:'page',live:'LIVE',off:'RECONNECTING',delay:'DELAYED',due:'DUE',
  in:'checked in',took:'taken by',start:'repair started',rdy:'is READY',dlv:'delivered',part:'waiting for a part',techs:'technicians',active:'busy',
  setup:'Open this screen from the app',setup2:'In the app: 📺 LIVE → 🖥 SHOP DISPLAY. That link carries the shop\'s cloud address.'},
 hi:{dep:'प्रस्थान बोर्ड',col:'कलेक्शन',tec:'वर्कबेंच',day:'आज',auto:'ऑटो',
  hd:['टिकट','फोन','खराबी','ग्राहक','टेक्नीशियन','स्थिति','दुकान में','वादा'],
  st:{NEW:'इंतज़ार',ASSIGNED:'लिया गया',REPAIR:'रिपेयर चालू',PARTS:'पार्ट का इंतज़ार',DONE:'जाँच',READY:'तैयार ✓',DELIVERED:'दे दिया'},
  inShop:'दुकान में फोन',waiting:'इंतज़ार',repairing:'रिपेयर',parts:'पार्ट बाकी',ready:'तैयार',done:'आज दिए',late:'लेट',
  working:'अभी रिपेयर हो रहे',readyH:'तैयार — ले जाएँ',free:'खाली — अगला काम दें',paused:'रुका',busy:'काम पर',queue:'आगे',
  today:'आज आए',fin:'आज पूरे',avg:'औसत समय',fast:'सबसे तेज़',page:'पेज',live:'लाइव',off:'जुड़ रहा',delay:'लेट',due:'देना',
  in:'आया',took:'लिया',start:'रिपेयर शुरू',rdy:'तैयार',dlv:'दे दिया',part:'पार्ट का इंतज़ार',techs:'टेक्नीशियन',active:'व्यस्त',
  setup:'यह स्क्रीन ऐप से खोलें',setup2:'ऐप में: 📺 LIVE → 🖥 SHOP DISPLAY'}};
function t(k){return (TX[LANG]||TX.en)[k];}
function $(i){return document.getElementById(i);}
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dur(ms){ms=Math.max(0,ms);var m=Math.floor(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);return d?d+'d '+(h%24)+'h':h?h+'h '+pad(m%60)+'m':m+'m';}
function durS(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?h+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60);}
function dayStart(){var d=new Date();d.setHours(0,0,0,0);return +d;}
function first(n){n=(''+(n||'')).trim().split(/\s+/);return (n[0]||'')+(n[1]?' '+n[1][0]+'.':'');}
/* ---- config: from the link (#k=...) or from the app on this same site ---- */
function cfgLoad(){try{var h=location.hash.match(/k=([^&]+)/);if(h){var o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h[1])))));try{L.setItem('SSM_DSP_CFG',JSON.stringify(o));}catch(e){}return o;}}catch(e){}
  try{var s=JSON.parse(L.getItem('SSM_DSP_CFG')||'null');if(s&&s.c)return s;}catch(e){}
  try{var a=JSON.parse(L.getItem('SSM_WOS_FB')||'null');if(a&&a.config&&a.enabled){var c=JSON.parse(a.config);if(c.projectId)return {c:c,cid:a.cid||'main',shop:a.cname||''};}}catch(e){}
  return null;}
var CFG=cfgLoad(),JOBS={},STAFF={},SHOP='',SEEN={},READYSEEN=null,ONLINE=false,R=0;
var SCR='dep',AUTO=true,SOUND=false,PAGE=0;
try{SCR=L.getItem('SSM_DSP_SCR')||'dep';AUTO=L.getItem('SSM_DSP_AUTO')!=='0';}catch(e){}
function rKey(){var q;try{q=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}catch(e){q='x';}return 'SSM_DSP_R_'+q;}
try{R=+(L.getItem(rKey())||0);}catch(e){}
function rAdd(n){R+=n;try{L.setItem(rKey(),''+R);}catch(e){}}
/* ---- data ---- */
function techName(id){var s=STAFF[id];return s?s.name:'';}
function openJobs(){return Object.keys(JOBS).map(function(k){return JOBS[k];}).filter(function(j){return j&&j.st&&j.st!=='DELIVERED';});}
function todayJobs(){var ds=dayStart();return Object.keys(JOBS).map(function(k){return JOBS[k];}).filter(function(j){return j&&((j.createdAt||0)>=ds||((j.tm||{}).delivered||0)>=ds);});}
function workMs(j){var m=j.tm||{};return (m.work||0)+(m.run?Math.max(0,Date.now()-m.run):0);}
function age(j){return Date.now()-(j.createdAt||(j.tm||{}).created||Date.now());}
function isLate(j){var c=j.c||{};return age(j)>2*864e5||(c.expTs&&Date.now()>c.expTs&&j.st!=='READY');}
function events(){var ev=[],ds=dayStart();Object.keys(JOBS).forEach(function(k){var j=JOBS[k],m=j.tm||{},c=j.c||{},ph=((c.brand||'')+' '+(c.model||'')).trim();
  var add=function(ts,txt){if(ts&&ts>=ds)ev.push({ts:ts,txt:j.id+' · '+ph+' — '+txt});};
  add(j.createdAt||m.created,t('in'));add(m.accepted,t('took')+' '+techName(j.tech));add(m.started,t('start'));add(m.ready||m.finished,t('rdy'));add(m.delivered,t('dlv'));});
  return ev.sort(function(a,b){return b.ts-a.ts;}).slice(0,25);}
/* ---- split-flap cell ---- */
var PREV={};
function flap(key,txt,cls){txt=''+(txt==null?'':txt);var ch=PREV[key]!==undefined&&PREV[key]!==txt;PREV[key]=txt;
  return '<div class="cell'+(ch?' flip':'')+(cls?' '+cls:'')+'">'+txt.split('').map(function(c,i){return '<span class="fl" style="animation-delay:'+(i*18)+'ms">'+(c===' '?'&nbsp;':esc(c))+'</span>';}).join('')+'</div>';}
/* ---- screens ---- */
var ORDER={REPAIR:0,ASSIGNED:1,PARTS:2,DONE:3,NEW:4,READY:5};
function rDep(){var a=openJobs().sort(function(x,y){var u=((y.urg&&y.urg.on)?1:0)-((x.urg&&x.urg.on)?1:0);return u||(ORDER[x.st]-ORDER[y.st])||(x.createdAt-y.createdAt);});
  var cnt=function(s){return a.filter(function(j){return s.indexOf(j.st)>=0;}).length;};
  var del=todayJobs().filter(function(j){return j.st==='DELIVERED';}).length,late=a.filter(isLate).length;
  $('depStats').innerHTML=st(a.length,t('inShop'),'var(--cyn)')+st(cnt(['NEW']),t('waiting'),'var(--amb)')+st(cnt(['ASSIGNED','REPAIR']),t('repairing'),'var(--cyn)')
    +st(cnt(['PARTS']),t('parts'),'var(--pur)')+st(cnt(['READY']),t('ready'),'var(--grn)')+st(del,t('done'),'var(--txt)')+st(late,t('late'),late?'var(--red)':'var(--dim)');
  $('depHead').innerHTML=t('hd').map(function(h,i){return '<div class="c'+(i+1)+'">'+h+'</div>';}).join('');
  var box=$('depRows'),rowH=Math.max(40,Math.min(64,innerHeight*0.056)),per=Math.max(4,Math.floor((box.clientHeight||innerHeight*0.6)/rowH));
  var pages=Math.max(1,Math.ceil(a.length/per));if(PAGE>=pages)PAGE=0;
  box.innerHTML=a.slice(PAGE*per,PAGE*per+per).map(function(j){var c=j.c||{},late=isLate(j),u=j.urg&&j.urg.on;
    var prom=c.expTs?(Date.now()>c.expTs&&j.st!=='READY'?t('delay')+' +'+dur(Date.now()-c.expTs):t('due')+' '+hm(c.expTs)):'—';
    return '<div class="brow">'+'<div class="c1">'+flap(j.id+'i',(u?'! ':'')+j.id,u?'urg':'')+'</div>'
      +'<div class="c2">'+flap(j.id+'p',((c.brand||'')+' '+(c.model||'')).trim().toUpperCase())+'</div>'
      +'<div class="c3">'+flap(j.id+'b',(c.prob||'').toUpperCase().slice(0,22))+'</div>'
      +'<div class="c4">'+flap(j.id+'c',first(c.name).toUpperCase())+'</div>'
      +'<div class="c5">'+flap(j.id+'t',(techName(j.tech)||'—').toUpperCase())+'</div>'
      +'<div class="c6"><span class="pill s'+j.st+'">'+esc(t('st')[j.st]||j.st)+(j.st==='REPAIR'&&j.tm&&j.tm.run?' ●':'')+'</span></div>'
      +'<div class="c7">'+flap(j.id+'a',dur(age(j)),late?'late':'')+'</div>'
      +'<div class="c8">'+flap(j.id+'e',prom,c.expTs&&Date.now()>c.expTs&&j.st!=='READY'?'late':'')+'</div></div>';}).join('');
  $('depPager').innerHTML='<span>'+t('page')+' '+(PAGE+1)+' / '+pages+'</span><span>'+a.length+' '+t('inShop')+'</span>';}
function st(n,l,col){return '<div class="st"><b style="color:'+col+'">'+n+'</b><span>'+esc(l)+'</span></div>';}
function rCol(){var a=openJobs(),work=a.filter(function(j){return ['NEW','ASSIGNED','REPAIR','PARTS','DONE'].indexOf(j.st)>=0;}).sort(function(x,y){return x.createdAt-y.createdAt;});
  var ready=a.filter(function(j){return j.st==='READY';}).sort(function(x,y){return ((y.tm||{}).ready||0)-((x.tm||{}).ready||0);});
  $('colWorkH').textContent='🔧 '+t('working')+' · '+work.length;$('colReadyH').textContent='✅ '+t('readyH')+' · '+ready.length;
  var tk=function(j,rd){var c=j.c||{};var nw=rd&&READYSEEN&&!READYSEEN[j.id];
    return '<div class="tk'+(rd?' rd':'')+(nw?' nw':'')+'"><b>'+esc(j.id.replace(/^R-0*/,'#').replace(/^B-0*/,'B'))+'</b><span>'+esc(first(c.name))+' · '+esc(((c.brand||'')+' '+(c.model||'')).trim())+'</span></div>';};
  $('colWork').innerHTML=work.slice(0,40).map(function(j){return tk(j,0);}).join('');
  $('colReady').innerHTML=ready.slice(0,30).map(function(j){return tk(j,1);}).join('');}
var COLORS=['#ffb020','#2ec5ff','#22d47a','#b17cff','#ff8a3d','#ff6fa8','#7cf2ff','#d7ff5a'];
function rTec(){var ids=Object.keys(STAFF).filter(function(k){return STAFF[k].role==='tech'&&STAFF[k].active;}),a=openJobs(),ds=dayStart();
  var busy=0,html=ids.map(function(id,i){var mine=a.filter(function(j){return j.tech===id&&['ASSIGNED','REPAIR','PARTS','DONE'].indexOf(j.st)>=0;})
      .sort(function(x,y){return ((y.tm||{}).run?1:0)-((x.tm||{}).run?1:0)||(ORDER[x.st]-ORDER[y.st]);});
    var cur=mine[0],doneT=Object.keys(JOBS).filter(function(k){var j=JOBS[k];return j.tech===id&&(((j.tm||{}).finished||0)>=ds);}).length;
    if(cur)busy++;var nm=STAFF[id].name||id;
    var ini=nm.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    var stp=['ASSIGNED','REPAIR','PARTS','DONE','READY'],ix=cur?stp.indexOf(cur.st):-1;
    return '<div class="tech"><div class="nm"><div class="av" style="background:'+COLORS[i%COLORS.length]+'">'+esc(ini)+'</div>'+esc(nm)
      +'<span class="state" style="color:'+(!cur?'var(--grn)':cur.tm&&cur.tm.run?'var(--cyn)':cur.st==='PARTS'?'var(--pur)':'var(--amb)')+'">'+(!cur?'○':cur.tm&&cur.tm.run?'● '+t('busy'):cur.st==='ASSIGNED'?'✋ '+t('st').ASSIGNED:cur.st==='PARTS'?'🧩 '+t('st').PARTS:cur.st==='DONE'?'✔ '+t('st').DONE:'⏸ '+t('paused'))+'</span></div>'
      +(cur?'<div class="job"><div class="ph">'+esc(((cur.c.brand||'')+' '+(cur.c.model||'')).trim())+' <span style="color:var(--dim);font-size:.6em">'+esc(cur.id)+'</span></div>'
        +'<div class="pb">'+esc((cur.c.prob||'').slice(0,40))+' · 👤 '+esc(first(cur.c.name))+'</div>'
        +'<div class="timer'+(cur.tm&&cur.tm.run?'':' paused')+'" data-w="'+((cur.tm||{}).work||0)+'" data-r="'+((cur.tm||{}).run||0)+'">'+durS(workMs(cur))+'</div>'
        +'<div class="steps">'+stp.map(function(s,k){return '<s class="'+(k<ix?'d':k===ix?'n':'')+'"></s>';}).join('')+'</div></div>'
        +(mine.length>1?'<div class="q">'+t('queue')+': '+mine.slice(1,6).map(function(j){return '<i>'+esc(j.id)+' '+esc(j.c.model||'')+'</i>';}).join('')+'</div>':'')
       :'<div class="free">✓ '+t('free')+'</div>')
      +'<div class="q">✔ '+doneT+' '+t('fin')+'</div></div>';}).join('');
  $('tecStats').innerHTML=st(ids.length,t('techs'),'var(--txt)')+st(busy,t('active'),'var(--cyn)')+st(ids.length-busy,'free','var(--grn)')
    +st(a.filter(function(j){return j.st==='NEW';}).length,t('waiting'),'var(--amb)');
  $('bench').innerHTML=html||'<div class="msg">—</div>';}
function rDay(){var ds=dayStart(),now=Date.now(),js=todayJobs().sort(function(x,y){return (x.createdAt||0)-(y.createdAt||0);});
  var open=Math.min(ds+9*36e5,js.length?Math.min.apply(null,js.map(function(j){return Math.max(ds,j.createdAt||ds);})):now),start=Math.min(open,now-36e5),end=Math.max(now,start+36e5);
  var X=function(ts){return Math.max(0,Math.min(100,(ts-start)*100/(end-start)));};
  var fin=js.filter(function(j){return ((j.tm||{}).finished||(j.tm||{}).ready||0)>=ds;});
  var rt=fin.map(function(j){return workMs(j)||(((j.tm||{}).finished||0)-((j.tm||{}).started||j.createdAt));}).filter(function(x){return x>0;}).sort(function(a,b){return a-b;});
  $('dayStats').innerHTML=st(js.filter(function(j){return (j.createdAt||0)>=ds;}).length,t('today'),'var(--amb)')+st(fin.length,t('fin'),'var(--grn)')
    +st(js.filter(function(j){return j.st==='DELIVERED';}).length,t('done'),'var(--txt)')+st(rt.length?dur(rt.reduce(function(a,b){return a+b;},0)/rt.length):'—',t('avg'),'var(--cyn)')
    +st(rt.length?dur(rt[0]):'—',t('fast'),'var(--pur)');
  var ax='',h=new Date(start);h.setMinutes(0,0,0);for(var ts=+h+36e5;ts<end;ts+=36e5)ax+='<span style="left:'+X(ts)+'%">'+hm(ts)+'</span>';
  $('legend').innerHTML='<span style="display:inline-block;width:26px;height:9px;border-radius:3px;background:repeating-linear-gradient(45deg,rgba(255,176,32,.6) 0 5px,rgba(255,176,32,.2) 5px 10px)"></span> '+t('waiting')+' &nbsp; <span style="display:inline-block;width:26px;height:9px;border-radius:3px;background:var(--cyn)"></span> '+t('repairing')+' &nbsp; <span style="display:inline-block;width:26px;height:9px;border-radius:3px;background:var(--grn)"></span> '+t('fin');
  $('axis').innerHTML=ax+'<span style="left:'+X(now)+'%;color:var(--red)">'+hm(now)+'</span>';
  var box=$('tlRows'),rh=Math.max(20,Math.min(34,innerHeight*0.032)),per=Math.max(5,Math.floor((box.clientHeight||300)/rh)),show=js.slice(-per);
  box.innerHTML=show.map(function(j){var m=j.tm||{},c=j.c||{},s0=Math.max(start,j.createdAt||start),s1=m.started||m.accepted||0,e=m.finished||m.ready||m.delivered||0;
    var w1=s1?X(s1)-X(s0):X(now)-X(s0),bars='<div class="bar wt" style="left:'+X(s0)+'%;width:'+Math.max(.4,w1)+'%"></div>';
    if(s1)bars+='<div class="bar '+(e?'dn':'go')+'" style="left:'+X(s1)+'%;width:'+Math.max(.4,X(e||now)-X(s1))+'%"></div>';
    return '<div class="tr"><div class="lb">'+esc(j.id)+' '+esc(((c.brand||'')+' '+(c.model||'')).trim())+'</div><div class="tk2">'+bars+'</div></div>';}).join('')
    +'<div class="nowl" style="left:calc(12em + (100% - 12em) * '+(X(now)/100)+')"></div>';}
function rTick(){var ev=events();$('tick').innerHTML=ev.length?ev.map(function(e){return '<em>'+hm(e.ts)+'</em>'+esc(e.txt);}).join(''):'—';
  $('tick').style.animationDuration=Math.max(30,ev.length*7)+'s';}
function render(){$('shop').textContent=(SHOP||'SAI WORKSHOP').toUpperCase();
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=t(e.getAttribute('data-t'));});
  document.querySelectorAll('#nav button[data-s]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===SCR);});
  document.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('on',s.id==='s-'+SCR);});
  $('auto').style.color=AUTO?'var(--amb)':'var(--dim)';$('snd').textContent=SOUND?'🔊':'🔇';
  try{({dep:rDep,col:rCol,tec:rTec,day:rDay})[SCR]();}catch(e){console.log(e);}rTick();
  $('foot2').textContent='reads today '+R;}
function tickClock(){var d=new Date();$('clock').firstChild.nodeValue=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  $('date').textContent=d.toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'short'});
  document.querySelectorAll('.timer').forEach(function(el){var w=+el.getAttribute('data-w'),r=+el.getAttribute('data-r');el.textContent=durS(w+(r?Date.now()-r:0));});}
/* ---- sound: a soft chime when a phone becomes READY ---- */
var AC=null;function chime(){if(!SOUND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[880,1175,1568].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.connect(g);g.connect(AC.destination);var s=AC.currentTime+i*0.18;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.25,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.6);o.start(s);o.stop(s+0.65);});}catch(e){}}
var FIRSTS=0;
function checkReady(){if(FIRSTS<NSRC)return;   /* wait for both lists, so phones already ready at start-up do not chime */
  var r={},nw=0;openJobs().forEach(function(j){if(j.st==='READY'){r[j.id]=1;if(READYSEEN&&!READYSEEN[j.id])nw++;}});
  var first=READYSEEN===null;if(!first&&nw){chime();if(AUTO){SCR='col';}}setTimeout(function(){READYSEEN=r;},first?0:4000);if(first)READYSEEN=r;}
/* ---- cloud ---- */
var SRC={open:{},today:{},qo:{},qd:{},qt:{}},NSRC=5;
/* a quick bill left for repair (🎫 ticket) shown exactly like a repair job — first name and phone only, never money */
function fromSale(d){if(!d||!d.quick||d.ret||!d.qst||d.qx||d.arch===2)return null;var m=d.qtm||{},it=(d.items||[]).map(function(c){return c.name;});
  return {id:d.id,_q:1,up:d.up,st:{NEW:'NEW',REPAIR:'REPAIR',READY:'READY',OUT:'DELIVERED'}[d.qst]||'NEW',createdAt:d.ts,tech:d.qtech||null,urg:null,
    c:{name:d.cust||'',brand:'',model:(d.model||it[0]||''),prob:d.note||(it.length>1?it.slice(1).join(', '):''),expTs:0},
    tm:{created:d.ts,accepted:m.REPAIR||0,started:m.REPAIR||0,run:d.qst==='REPAIR'?(m.REPAIR||0):0,ready:m.READY||0,finished:m.READY||0,delivered:m.OUT||0}};}
function rebuild(){JOBS={};['open','today','qo','qd','qt'].forEach(function(k){Object.keys(SRC[k]).forEach(function(id){var d=SRC[k][id],o=JOBS[id];if(!o||(+d.up||0)>=(+o.up||0))JOBS[id]=d;});});}
var GOT={};
function apply(src,snap){if(!GOT[src]){GOT[src]=1;FIRSTS++;}var isQ=src.charAt(0)==='q';var ch=snap.docChanges?snap.docChanges():[];if(!(snap.metadata&&snap.metadata.fromCache))rAdd(Math.max(1,ch.length));
  ch.forEach(function(x){var d=x.doc.data();var id=(d&&d.id)||x.doc.id;if(!id)return;
    if(isQ)d=fromSale(d);
    if(x.type==='removed'||!d||d.arch===2)delete SRC[src][id];else SRC[src][id]=d;});   /* a phone that left this list (delivered / archived) */
  rebuild();ONLINE=true;$('live').className='live';$('liveTx').textContent=t('live');checkReady();render();}
function start(){if(!CFG||!CFG.c){$('msg').style.display='grid';$('msg').innerHTML='<div><b>📺 '+t('setup')+'</b>'+t('setup2')+'</div>';return;}
  SHOP=CFG.shop||'';
  try{if(!firebase.apps.length)firebase.initializeApp(CFG.c);}catch(e){}
  var db=firebase.firestore(),pre='c_'+(CFG.cid||'main')+'_',jobs=db.collection(pre+'jobs');
  var err=function(){ONLINE=false;$('live').className='live off';$('liveTx').textContent=t('off');};
  jobs.where('st','in',['NEW','ASSIGNED','REPAIR','PARTS','DONE','READY']).onSnapshot(function(s){apply('open',s);},err);
  jobs.where('tm.delivered','>=',dayStart()).onSnapshot(function(s){apply('today',s);},err);
  var sale=db.collection(pre+'sale');   /* ⚡ quick-bill tickets */
  sale.where('qopen','==',1).onSnapshot(function(s){apply('qo',s);},err);
  sale.where('qtm.OUT','>=',dayStart()).onSnapshot(function(s){apply('qd',s);},err);
  sale.where('ts','>=',dayStart()).onSnapshot(function(s){apply('qt',s);},err);
  var nx=new Date();nx.setHours(24,3,0,0);setTimeout(function(){location.reload();},+nx-Date.now());   /* a fresh day at midnight */
  db.collection(pre+'meta').doc('main').onSnapshot(function(d){rAdd(1);var x=d&&d.data&&d.data();if(!x)return;
    STAFF={};(x.staff||[]).forEach(function(s){STAFF[s.id]=s;});if(x.settings&&x.settings.shop)SHOP=x.settings.shop;render();},err);}
function loadFb(cb){if(window.firebase&&firebase.firestore)return cb();var n=0,s=['app','firestore'];s.forEach(function(k){var e=document.createElement('script');
  e.src='https://www.gstatic.com/firebasejs/'+FBV+'/firebase-'+k+'-compat.js';e.onload=function(){if(++n===1){var e2=document.createElement('script');e2.src='https://www.gstatic.com/firebasejs/'+FBV+'/firebase-firestore-compat.js';e2.onload=cb;document.head.appendChild(e2);}};
  if(k==='app')document.head.appendChild(e);});}
/* ---- controls ---- */
document.querySelectorAll('#nav button[data-s]').forEach(function(b){b.onclick=function(){SCR=b.getAttribute('data-s');PAGE=0;try{L.setItem('SSM_DSP_SCR',SCR);}catch(e){}render();};});
$('auto').onclick=function(){AUTO=!AUTO;try{L.setItem('SSM_DSP_AUTO',AUTO?'1':'0');}catch(e){}render();};
$('snd').onclick=function(){SOUND=!SOUND;if(SOUND)chime();render();};
$('lang').onclick=function(){LANG=LANG==='hi'?'en':'hi';try{L.setItem('SSM_DSP_LANG',LANG);}catch(e){}render();};
$('fs').onclick=function(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener('keydown',function(e){var m={'1':'dep','2':'col','3':'tec','4':'day'};if(m[e.key]){SCR=m[e.key];PAGE=0;render();}if(e.key==='f')$('fs').click();});
var ROT=['dep','col','tec','day'],rotT=0;
setInterval(tickClock,1000);tickClock();
setInterval(function(){if(SCR==='dep'){PAGE++;rDep();}},9000);
setInterval(function(){if(!AUTO)return;rotT++;if(SCR==='dep'&&PAGE!==0)return;if(rotT>=2){rotT=0;SCR=ROT[(ROT.indexOf(SCR)+1)%ROT.length];PAGE=0;render();}},12000);
setInterval(function(){render();},30000);
window.addEventListener('resize',render);
window.addEventListener('hashchange',function(){if(/k=/.test(location.hash))location.reload();});   /* a new link pasted into an open screen */
render();loadFb(start);
</script>
